<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taaleiland — Swipe models</title>
<meta name="catalogus-gebouwd" content="2026-09-21T01:23:24Z">
<meta name="catalogus-versie" content="6e658725a8">
<meta name="description" content="A tool to judge catalog models one at a time: swipe left, right, up or down, then export a list of paths per direction — for selections, tags, kinds or adjustments.">
<link rel="stylesheet" href="catalog.css?v=6e658725a8">
<link rel="stylesheet" href="swipe.css?v=6e658725a8"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏝️</text></svg>">
</head>
<body class="swipe-body">

<header class="kop">
  <nav class="paginabalk" aria-label="Pages">
    <a href="../../index.html">Catalog</a>
    <a href="scale-obj-gen.html">Scale</a>
    <span aria-current="page">Swipe</span>
    <a href="tbd.html">TBD</a>
    <a href="reject.html">Reject</a>
    <a href="swipe.html?source=lint">Lint</a>
  </nav>

  <div class="kop-titel">
    <h1><span class="breed">Swipe models</span><span class="smal">Swipe</span></h1>
    <p class="kop-sub" id="samenvatting">Loading catalog…</p>
  </div>

  <div class="kop-bediening">
    <button class="knop" type="button" id="instellingen" title="Adjust labels and selection">⚙<span class="breed">Settings</span></button>
    <button class="knop" type="button" id="licht" aria-pressed="false"
            title="Shows the models unlit: only the atlas colours, with the shading baked into them">Flat</button>
    <button class="knop primair" type="button" id="naar-uitslag">Results</button>
  </div>
  <span class="bouwstempel" id="bouwstempel"></span>
</header>

<section class="opzet" id="opzet" hidden>
  <form id="opzet-formulier">
    <div class="opzet-blok">
      <div class="opzet-regel">
        <input type="search" id="zoek" placeholder="Search by name" autocomplete="off">
        <label class="opzet-schakel"><input type="checkbox" id="schud"> Random order</label>
        <button type="button" class="knop" id="opzet-wis">Clear filters</button>
      </div>
      <p class="veld-hint">Tap once to keep only that, twice to leave it out. Nothing tapped = everything.</p>
      <div class="opzet-filters" id="opzet-filters"></div>
    </div>

    <div class="opzet-blok">
      <div class="opzet-labels">
        <label class="veld veld-kort">← Left<input type="text" id="label-links" maxlength="40"></label>
        <label class="veld veld-kort">→ Right<input type="text" id="label-rechts" maxlength="40"></label>
        <label class="veld veld-kort">↑ Up<input type="text" id="label-omhoog" maxlength="40"></label>
        <label class="veld veld-kort">↓ Down<input type="text" id="label-omlaag" maxlength="40"></label>
      </div>
    </div>

    <div class="opzet-acties">
      <p class="opzet-telling" id="opzet-telling"></p>
      <button type="button" class="knop" id="opzet-annuleer">Back to the deck</button>
      <button type="submit" class="knop primair" id="opzet-start">Apply</button>
    </div>
  </form>
</section>

<main class="dek" id="dek" hidden>
  <div class="dek-rand dek-rand-omhoog" data-richting="omhoog"><span></span></div>
  <div class="dek-midden">
    <div class="dek-rand dek-rand-links" data-richting="links"><span></span></div>
    <div class="stapel" id="stapel" aria-live="polite"></div>
    <div class="dek-rand dek-rand-rechts" data-richting="rechts"><span></span></div>
  </div>
  <div class="dek-rand dek-rand-omlaag" data-richting="omlaag"><span></span></div>

  <div class="voortgang">
    <div class="voortgang-balk"><i id="voortgang-vulling"></i></div>
    <span class="voortgang-tekst" id="voortgang-tekst"></span>
  </div>

  <div class="bediening">
    <button class="knop richtingknop" type="button" data-richting="links"><b>←</b><span></span></button>
    <button class="knop richtingknop" type="button" data-richting="omlaag"><b>↓</b><span></span></button>
    <button class="knop richtingknop" type="button" data-richting="omhoog"><b>↑</b><span></span></button>
    <button class="knop richtingknop" type="button" data-richting="rechts"><b>→</b><span></span></button>
    <button class="knop" type="button" id="terug" title="Undo the last choice (Z)">↺ Undo</button>
  </div>
  <p class="sneltoetsen">Drag the card, use the arrow keys or the buttons. <kbd>Z</kbd> undoes, <kbd>Esc</kbd> opens the results. Labels and selection live under <b>Settings</b>.</p>
</main>

<section class="uitslag" id="uitslag" hidden>
  <div class="uitslag-kop">
    <h2>Results</h2>
    <div class="uitslag-acties">
      <button class="knop" type="button" id="verder">Keep swiping</button>
      <button class="knop" type="button" id="download-json">Download extract</button>
      <button class="knop" type="button" id="download-csv">Download CSV</button>
      <button class="knop" type="button" id="wis-alles">Clear all</button>
    </div>
  </div>
  <div class="uitslag-bakken" id="uitslag-bakken"></div>
</section>

<div class="onderbalken">
  <div class="tagedit-balk" id="extract-balk" hidden>
    <span class="tagedit-balk-telling" id="extract-balk-telling" aria-live="polite"></span>
    <button type="button" id="extract-balk-download">Download extract</button>
    <button type="button" id="extract-balk-wis">Clear</button>
  </div>
</div>

<p class="leeg" id="melding" hidden></p>

<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
<script src="vendor/model-viewer.min.js" type="module"></script>
<script src="swipe.js?v=6e658725a8" type="module"></script></body>
</html>
