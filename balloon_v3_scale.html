<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balloon terracotta — scale check against reference assets</title>
<style>
  html,body{margin:0;height:100%;background:#E7E9E3;color:#181B17;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  #gl{display:block;width:100%;height:100%}
  #hud{position:fixed;left:12px;top:12px;color:#767C71;letter-spacing:.04em;white-space:pre}
  #hud b{color:#181B17;font-weight:400}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">loading reference assets…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearAlpha(0);

function col(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }
function hash2(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function flatVC(side){ return new THREE.MeshPhongMaterial({vertexColors:true, flatShading:true, shininess:0, specular:col('#000000'), side:side || THREE.FrontSide}); }
function flat(hex, side){ return new THREE.MeshPhongMaterial({color:col(hex), flatShading:true, shininess:0, specular:col('#000000'), side:side || THREE.FrontSide}); }

function spun(rings, sides, colorFn, jitter){
  const pos = [], cols = [], tmp = new THREE.Color();
  for(let i = 0; i < rings.length-1; i++){
    for(let s = 0; s < sides; s++){
      const a0 = s/sides*Math.PI*2, a1 = (s+1)/sides*Math.PI*2;
      const A = [rings[i].r*Math.cos(a0), rings[i].y, rings[i].r*Math.sin(a0)];
      const B = [rings[i].r*Math.cos(a1), rings[i].y, rings[i].r*Math.sin(a1)];
      const C = [rings[i+1].r*Math.cos(a1), rings[i+1].y, rings[i+1].r*Math.sin(a1)];
      const D = [rings[i+1].r*Math.cos(a0), rings[i+1].y, rings[i+1].r*Math.sin(a0)];
      tmp.set(colorFn(i, s)).convertSRGBToLinear();
      if(jitter) tmp.multiplyScalar(1 - jitter*0.5 + hash2(i*7+1, s*3+2)*jitter);
      [A,C,B, A,D,C].forEach(function(v){ pos.push(v[0],v[1],v[2]); cols.push(tmp.r,tmp.g,tmp.b); });
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.computeVertexNormals();
  return g;
}

function seamLines(rings, sides, from, to){
  const p = [];
  for(let s = 0; s < sides; s++){
    const a = s/sides*Math.PI*2;
    for(let i = from; i < to; i++){
      p.push(rings[i].r*Math.cos(a), rings[i].y, rings[i].r*Math.sin(a));
      p.push(rings[i+1].r*Math.cos(a), rings[i+1].y, rings[i+1].r*Math.sin(a));
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  return g;
}

/* ---------- balloon envelope, terracotta ---------- */

const BONE = 0xf0ece3, CLAY = 0xd07b56, STEEL = 0x6d738a;
const STEEL_HEX = '#6d738a', INK = '#3e3e44';

function balloonEnvelope(){
  const body = new THREE.Group();

  const prof = [
    [0.22,-2.08],[0.58,-1.76],[0.98,-1.34],[1.34,-0.86],[1.64,-0.3],
    [1.82,0.26],[1.888,0.76],[1.832,1.22],[1.66,1.6],[1.36,1.94],
    [0.94,2.22],[0.46,2.4],[0.2,2.472]
  ];
  const rings = prof.map(function(p){ return {r:p[0], y:p[1]}; });
  const GORES = 16;

  const envelope = spun(rings, GORES, function(i, s){
    if(i <= 1) return STEEL;
    if(i >= 10) return CLAY;
    const k = s % 4;
    return k === 1 ? CLAY : (k === 3 ? STEEL : BONE);
  }, 0.05);
  body.add(new THREE.Mesh(envelope, flatVC()));

  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.064, GORES), flat(INK));
  crown.position.y = 2.488;
  body.add(crown);

  /* PO note: outlines. Seam tapes kept as a core feature; opaque, no transparency. */
  body.add(new THREE.LineSegments(seamLines(rings, GORES, 0, rings.length-1),
    new THREE.LineBasicMaterial({color: col(STEEL_HEX)})));

  const mouth = new THREE.Mesh(new THREE.CircleGeometry(0.22, GORES), flat(INK));
  mouth.rotation.x = Math.PI/2;
  mouth.position.y = -2.08;
  body.add(mouth);

  /* pivot at the mouth so the envelope sits on Y = 0 like every other asset */
  body.position.y = 2.08;
  const wrap = new THREE.Group();
  wrap.add(body);
  wrap.userData.body = body;
  return wrap;
}

/* ---------- scene ---------- */

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(col('#E2EAF2'), col('#787E86'), 0.85));
scene.add(new THREE.AmbientLight(col('#DCE4EC'), 0.14));
const key = new THREE.DirectionalLight(col('#FFF6E8'), 0.85);
key.position.set(2.6, 4, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(col('#C7D6E8'), 0.25);
fill.position.set(-2, 1, -2.5);
scene.add(fill);
const rim = new THREE.DirectionalLight(col('#FFE4BC'), 0.28);
rim.position.set(-2.5, 0.8, -2.2);
scene.add(rim);

/* 1 × 1 unit floor grid — the style guide's wall/floor segment */
const grid = new THREE.GridHelper(24, 24, col('#B7BDB4'), col('#CDD2C9'));
grid.position.y = 0.001;
scene.add(grid);

/* the three subjects, spaced on X, every one standing on Y = 0 at native scale */
const SLOTS = [
  {x:-5.5, label:'lighthouse',         src:'kits/taalei-kit/lighthouse.glb'},
  {x: 0.0, label:'balloon terracotta', src:null},
  {x: 5.0, label:'palm-detailed-bend', src:'kits/pirate-kit/palm-detailed-bend.glb'}
];

const balloon = balloonEnvelope();
balloon.position.x = SLOTS[1].x;
scene.add(balloon);

const sizes = {};
function measure(obj, name){
  const box = new THREE.Box3().setFromObject(obj);
  const s = new THREE.Vector3();
  box.getSize(s);
  sizes[name] = s;
  return s;
}
measure(balloon, 'balloon terracotta');

const loader = new THREE.GLTFLoader();
let pending = 2;
SLOTS.filter(function(s){ return s.src; }).forEach(function(slot){
  loader.load(slot.src, function(gltf){
    const root = gltf.scene;
    root.traverse(function(o){
      if(o.isMesh && o.material && o.material.map) o.material.map.encoding = THREE.sRGBEncoding;
    });
    root.position.x = slot.x;
    scene.add(root);
    measure(root, slot.label);
    if(--pending === 0) report();
  }, undefined, function(err){
    sizes[slot.label] = null;
    console.error('failed to load ' + slot.src, err);
    if(--pending === 0) report();
  });
});

function report(){
  const lines = ['balloon terracotta · scale check on a 1×1 unit grid · drag to orbit'];
  SLOTS.forEach(function(s){
    const v = sizes[s.label];
    lines.push(v
      ? '  ' + s.label.padEnd(20) + v.x.toFixed(2) + ' w · ' + v.y.toFixed(2) + ' h · ' + v.z.toFixed(2) + ' d units'
      : '  ' + s.label.padEnd(20) + 'failed to load');
  });
  document.getElementById('hud').textContent = lines.join('\n');
}

const camera = new THREE.PerspectiveCamera(34, 1, 0.4, 200);
camera.position.set(1.2, 4.6, 20);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(canvas.width !== Math.floor(w*renderer.getPixelRatio()) || canvas.height !== Math.floor(h*renderer.getPixelRatio())){
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
}

const clock = new THREE.Clock();
function frame(){
  resize();
  const t = clock.getElapsedTime();
  /* the envelope keeps its idle sway, but its footprint stays put */
  balloon.userData.body.rotation.y += 0.14*0.0125;
  balloon.userData.body.rotation.z = Math.sin(t*0.55)*0.022;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
