<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e4da">
<title>Terreinbouwer</title>
<link rel="stylesheet" href="bouwer.css?v=421cd7997b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧱</text></svg>">
<script type="importmap">
{"imports":{"three":"../../vendor/three/three.module.min.js","three/addons/":"../../vendor/three/addons/"}}
</script>
</head>
<body>

<header class="kop">
  <div class="kop-groep">
    <button type="button" class="knop" id="laag-min" aria-label="Een laag omlaag">−</button>
    <span class="kop-waarde"><small>laag</small><output id="laag-nu">0</output></span>
    <button type="button" class="knop" id="laag-plus" aria-label="Een laag omhoog">+</button>
  </div>

  <button type="button" class="knop knop-breed" id="draai" aria-label="Draai een kwartslag">
    ⟳&nbsp;<output id="draai-nu">0°</output>
  </button>

  <button type="button" class="knop" id="ongedaan" aria-label="Ongedaan maken" disabled>↶</button>
  <button type="button" class="knop" id="opnieuw" aria-label="Opnieuw doen" disabled>↷</button>

  <button type="button" class="knop knop-stand" id="stand-knop" aria-label="Toon de voegen">
    <span id="stand">leeg</span>
  </button>
</header>

<main class="doek">
  <canvas id="doek"></canvas>
  <p class="wenk" id="wenk"></p>

  <div class="storing" id="storing" hidden>
    <h2>De bouwer start niet</h2>
    <p id="storing-tekst"></p>
    <ul id="storing-lijst"></ul>
  </div>
</main>

<footer class="voet">
  <button type="button" class="stuk-kiezer" id="stuk-knop">
    <small>stuk</small>
    <span id="penseel">kies een stuk</span>
  </button>
  <button type="button" class="doe doe-zet" id="zet" disabled>Zet neer</button>
  <button type="button" class="doe doe-weg" id="weg" disabled>Weg</button>
</footer>

<footer class="voet voet-kijk" id="voet-kijk" hidden>
  <div class="kijk-rij">
    <button type="button" class="knop" id="kijk-vorige" aria-label="Vorige voeg">‹</button>
    <div class="kijk-info">
      <span id="kijk-namen"></span>
      <small id="kijk-bij"></small>
    </div>
    <button type="button" class="knop" id="kijk-volgende" aria-label="Volgende voeg">›</button>
  </div>
  <button type="button" class="doe doe-verder" id="kijk-volgend-bouwsel" hidden>
    Volgend bouwsel ›
  </button>
  <div class="kijk-rij">
    <button type="button" class="doe doe-zet" id="kijk-goed">✓ goed</button>
    <button type="button" class="doe doe-weg" id="kijk-niet">✗ niet</button>
    <button type="button" class="knop" id="kijk-stop" aria-label="Klaar met kijken">✕</button>
  </div>
</footer>

<div class="waas" id="waas" hidden></div>
<div class="blad" id="blad" hidden>
  <div class="blad-kop">
    <h2 id="blad-titel"></h2>
    <button type="button" class="knop" id="blad-sluit" aria-label="Sluiten">✕</button>
  </div>
  <div class="blad-tabs" id="blad-tabs"></div>
  <div class="blad-zoek" id="blad-zoek" hidden>
    <input type="search" id="zoek" placeholder="Zoek een stuk…" autocomplete="off" aria-label="Zoek een stuk">
  </div>
  <div class="blad-filters" id="blad-filters"></div>
  <div class="blad-inhoud" id="blad-inhoud"></div>
</div>

<script>
(function () {
  function omgeving() {
    var regels = [];
    var kanImportmap = !!(window.HTMLScriptElement && HTMLScriptElement.supports
      && HTMLScriptElement.supports('importmap'));
    regels.push('import maps: ' + (kanImportmap ? 'ja' : 'NEE — deze browser kan de bouwer niet laden'));

    var kanWebgl = false;
    try {
      kanWebgl = !!document.createElement('canvas').getContext('webgl2');
    } catch (fout) {
      kanWebgl = false;
    }
    regels.push('WebGL 2: ' + (kanWebgl ? 'ja' : 'NEE — de bouwer heeft WebGL 2 nodig'));
    regels.push('scherm: ' + document.documentElement.clientWidth + '×' + document.documentElement.clientHeight);
    regels.push('adres: ' + location.href);
    return regels;
  }

  function toon(tekst) {
    if (window.KLAAR) return;
    var bak = document.getElementById('storing');
    if (!bak || !bak.hidden) return;
    bak.hidden = false;
    document.getElementById('storing-tekst').textContent = tekst;
    var lijst = document.getElementById('storing-lijst');
    omgeving().forEach(function (regel) {
      var item = document.createElement('li');
      item.textContent = regel;
      lijst.appendChild(item);
    });
  }

  addEventListener('error', function (gebeurtenis) {
    var doel = gebeurtenis.target;
    if (doel && doel !== window && doel.src) {
      toon('Dit bestand kwam niet binnen: ' + doel.src);
      return;
    }
    toon(String(gebeurtenis.message || (gebeurtenis.error && gebeurtenis.error.message) || gebeurtenis.type));
  }, true);
  addEventListener('unhandledrejection', function (gebeurtenis) {
    toon(String((gebeurtenis.reason && gebeurtenis.reason.message) || gebeurtenis.reason));
  });

  setTimeout(function () {
    toon('De bouwer is na tien seconden nog niet klaar. Ververs de pagina; blijft '
      + 'het hangen, dan staat hieronder wat deze browser wel en niet kan.');
  }, 10000);
})();
</script>

<script src="bouwer.js?v=421cd7997b" type="module"></script>
</body>
</html>
