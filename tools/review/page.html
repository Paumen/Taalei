<title>%%TITLE%%</title>
<style>
:root{--paper:#f7f5f2;--card:#fff;--ink:#2a2622;--soft:#756a60;--line:#e6ddd2;--accent:#995a41;--tile:#f2f2f0;
--keep:#2f8a45;--retry:#c27c0e;--undo:#c0392b;--warn-bg:#fff4d6;--warn:#7a5200;--info-bg:#e9f1fb;--info:#24508a;--box:#1f8fff;
--scale-paper:#f6f1ea;--grid-fine:#c6b8a5;--grid-heavy:#6b6058;--limit:#b5543f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1f1d1c;--card:#292624;--ink:#ece3d8;--soft:#a3968a;--line:#3d3632;--accent:#dd9f79;
--keep:#5cbf72;--retry:#e0a63c;--undo:#e8705f;--warn-bg:#3d3220;--warn:#f0cf86;--info-bg:#1f2c3d;--info:#9cc3f0;--box:#4aa8ff;--scale-paper:#1c1a19;--grid-fine:#4a423d;--grid-heavy:#9d9084;--limit:#e08a70;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1f1d1c;--card:#292624;--ink:#ece3d8;--soft:#a3968a;--line:#3d3632;--accent:#dd9f79;
--keep:#5cbf72;--retry:#e0a63c;--undo:#e8705f;--warn-bg:#3d3220;--warn:#f0cf86;--info-bg:#1f2c3d;--info:#9cc3f0;--box:#4aa8ff;--scale-paper:#1c1a19;--grid-fine:#4a423d;--grid-heavy:#9d9084;--limit:#e08a70;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:540px;margin:0 auto;padding:0 10px 84px}
.top{position:sticky;top:0;z-index:3;background:var(--paper);display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.top .title{font-weight:700;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--soft);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.switch[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
h2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:14px 2px 6px}
h2 small{font-weight:400;color:var(--soft)}
h2 button{margin-left:auto}
article{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
article.v-keep{border-color:var(--keep)}article.v-retry{border-color:var(--retry)}article.v-revert{border-color:var(--undo)}article.v-other{border-color:var(--ink)}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.head .name{font-weight:700;overflow-wrap:anywhere}
.head .group{color:var(--soft);font-size:12px;margin-right:auto}
.alert{margin:0 0 6px;padding:6px 9px;border-radius:8px;font-weight:600;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--info)}
.alert b{font-size:16px}
.text{margin:0 0 6px;font-size:14px}
.text .k{color:var(--soft)}
.why{color:var(--warn);font-weight:600}
.view{position:relative}
.wipe,.pic{position:relative;margin:0;background:var(--tile);border-radius:9px;overflow:hidden;aspect-ratio:1}
.wipe{touch-action:pan-y;user-select:none}
.wipe img,.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.wipe .a{clip-path:inset(0 0 0 var(--x,50%))}
.wipe .h{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;margin-left:-1px;background:var(--accent)}
.wipe .h::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--accent);color:#fff;font:700 13px system-ui;padding:4px 8px;border-radius:10px;letter-spacing:2px}
.cap{position:absolute;top:6px;font-size:12px;font-weight:700;color:#4a423b;background:rgba(255,255,255,.85);padding:1px 7px;border-radius:5px}
.cap.l{left:6px}.cap.r{right:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pic .bx{position:absolute;border:2px solid var(--box);border-radius:5px;box-shadow:0 0 0 1px rgba(255,255,255,.85)}
.flipb{position:absolute;right:6px;bottom:6px;z-index:2;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.92);color:#2a2622;font:600 12px system-ui;cursor:pointer}
.pin{position:absolute;display:grid;place-items:center;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--undo);color:#fff;font:700 12px system-ui;box-shadow:0 0 0 2px #fff;cursor:pointer;z-index:2}
.tip{margin:3px 0 0;color:var(--soft);font-size:12px;text-align:center}
.scale{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.scale svg{display:block;width:100%;height:auto;border-radius:9px}
.facts{display:grid;grid-template-columns:62px minmax(0,1fr) 16px minmax(0,1fr);gap:6px 6px;align-items:center;margin:8px 0 2px;font-size:13px}
.facts .lab{color:var(--soft);font-size:12px}
.facts .lab b{display:block;color:var(--ink);font-size:13px}
.facts .b,.facts .n{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0;font-variant-numeric:tabular-nums}
.facts .ar{color:var(--soft);text-align:center}
.facts .n{font-weight:700}
.fh{color:var(--soft);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.chip{white-space:nowrap;padding:1px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:400}
.chip.out{border-color:var(--undo);color:var(--undo);text-decoration:line-through}
.chip.in{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.sw{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 4px;border:1px solid rgba(0,0,0,.18);border-radius:6px;background:var(--c);color:var(--tx);font:700 11px system-ui}
.sw.out{opacity:.45;text-decoration:line-through}
.sw.in{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--ink)}
.none{color:var(--soft);font-weight:400}
.main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.main button{display:grid;justify-items:center;gap:1px;min-height:56px;padding:6px 4px;border-radius:12px;border:2px solid;background:var(--card);font:700 17px system-ui,sans-serif;cursor:pointer}
.main button small{font-size:11.5px;font-weight:500;opacity:.85}
.main .keep{border-color:var(--keep);color:var(--keep)}.main .retry{border-color:var(--retry);color:var(--retry)}.main .revert{border-color:var(--undo);color:var(--undo)}
.main .keep.on{background:var(--keep);color:#fff}.main .retry.on{background:var(--retry);color:#fff}.main .revert.on{background:var(--undo);color:#fff}
.says{margin:6px 0 0;padding:6px 9px;border-radius:8px;background:var(--paper);font-size:13px}
.says b{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center}
.row .lb{font-size:12px;color:var(--soft);margin-right:2px}
.row button{font:500 13px system-ui,sans-serif;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.row button.on{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
.row button.is{border-color:var(--undo);background:var(--undo);color:#fff}
textarea{display:block;width:100%;margin-top:8px;font:14px system-ui,sans-serif;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-height:44px;resize:vertical}
textarea.need{border:2px solid var(--retry)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .count{color:var(--soft);font-variant-numeric:tabular-nums;margin-right:auto}
.bar button{font:700 15px system-ui,sans-serif;padding:10px 18px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
#ta{position:absolute;left:-9999px}
</style>
<main>
<div class="top" id="top"></div>
<div id="list"></div>
</main>
<div class="bar"><div class="in"><span class="count" id="n"></span><button id="cp" type="button">Copy verdicts</button></div></div>
<textarea id="ta" aria-hidden="true" tabindex="-1"></textarea>
<script id="data" type="application/json">%%DATA%%</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const MAIN=[['keep','✓ Keep','stays'],['retry','↻ Try again','new attempt'],['revert','✕ Undo','back, done']];
const MORE=[['keepbut','Keep, but…'],['relax','Relax rule'],['other','Other'],['later','Later']];
const SAYS={
  keep:['Keep','the change stays.'],
  retry:['Try again','the model goes back to before, then gets a new attempt. Say what to do differently.'],
  revert:['Undo','the model goes back to before. No new attempt.'],
  keepbut:['Keep, but','the change stays, plus a follow-up. Say which.'],
  relax:['Relax rule','the model goes back to before and the rule gets looser. Say which rule, and how.'],
  other:['Other','say what should happen.'],
  later:['Later','left open for a later round.'],
};
const PROPOSAL={keep:['✓ Do it','agree','the proposal gets done.'],retry:['↻ Rethink','other idea','say what to propose instead.'],revert:['✕ Don\'t','leave as is','nothing changes.']};
const NEED=new Set(['retry','keepbut','relax','other']);
const ISSUE={size:['too big','too small','stretched'],tag:['wrong tag','tag missing'],recolour:['too dark','too light','parts blend','wrong part','too busy'],shape:['too thick','too thin','deformed','parts fused','lost detail'],geometry:['too blocky','too dense','holes','spikes','lost detail']};
const K='review:'+D.title+':'+D.base;
let st={};try{st=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
const empty=s=>!s.v&&!s.c&&!s.m&&!(s.f||[]).length&&!(s.p||[]).length;
const judged=s=>s&&!empty(s);
let side=false,openOnly=false,dragged=false;const back=new Set();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>(+v.toFixed(v>0.2?1:2))+' m';
const sign=n=>(n>0?'+':'')+n;
const ink=h=>{const [r,g,b]=[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));return .299*r+.587*g+.114*b>150?'#2a2622':'#fff'};
function facts(it){
  const r=[],row=(lab,sub,b,n)=>r.push(`<div class="lab"><b>${lab}</b>${sub||''}</div><div class="b">${b||'<span class="none">none</span>'}</div><div class="ar">→</div><div class="n">${n||'<span class="none">none</span>'}</div>`);
  for(const f of it.facts){
    if(f.f==='kind')row('Kind','',`<span class="chip">${esc(f.from||'none')}</span>`,`<span class="chip in">${esc(f.to||'none')}</span>`);
    if(f.f==='tags')row('Tags','',f.remove.map(t=>`<span class="chip out" title="${esc(t.type)}">${esc(t.id)}</span>`).join(''),f.add.map(t=>`<span class="chip in" title="${esc(t.type)}">${esc(t.id)}</span>`).join(''));
    if(f.f==='size')row('Size',`×${(+f.factor).toFixed(2)}`,fmt(f.from),fmt(f.to));
    if(f.f==='tris')row('Triangles',`${sign(f.pct)}%`,f.from.toLocaleString('en'),f.to.toLocaleString('en'));
    if(f.f==='colour'){
      const was=new Set(f.from.map(b=>b.name)),now=new Set(f.to.map(b=>b.name));
      const sw=(b,cls)=>`<i class="sw ${cls}" title="${esc(b.name)}" style="--c:${b.hex};--tx:${ink(b.hex)}">${b.share}%</i>`;
      row('Colours',`${f.changed}% moved`,f.from.map(b=>sw(b,now.has(b.name)?'':'out')).join(''),f.to.map(b=>sw(b,was.has(b.name)?'':'in')).join(''));
    }
    if(f.f==='shape')r.push(`<div class="lab"><b>Shape</b></div><div class="b" style="grid-column:span 3">${f.move==null?'points changed, not measurable':`points moved up to ${f.move}% of its size`}</div>`);
  }
  return r.length?`<div class="facts"><span></span><span class="fh">Before</span><span></span><span class="fh">After</span>${r.join('')}</div>`:'';
}
function scalePanel(it){
  const S=it.scale,B=S.before.wdh,A=S.after.wdh;
  const content=Math.max(B[2],A[2]);
  const lim=[];
  if(S.min!=null)lim.push(['min',S.min]);if(S.max!=null)lim.push(['max',S.max]);
  const shown=lim.filter(([,v])=>v>0&&v<=Math.max(content,Math.max(...B,...A))*1.6);
  const step=0.2;
  const top=Math.max(1,Math.ceil((Math.max(content,...shown.map(l=>l[1]))*1.05)/step-1e-9)*step);
  const widest=Math.max(B[0],A[0]);
  const span=Math.max(widest*1.25,top*0.9);
  const W=200,stick=7,pad=14,pxm=(W-2*pad-2*stick)/span,H=top*pxm,gy=H+8,VH=gy+6;
  const left=pad+stick,right=W-pad-stick;
  const one=(m,label)=>{
    let g=`<svg viewBox="0 0 ${W} ${VH}" role="img" aria-label="${label} at true size"><rect width="${W}" height="${VH}" fill="var(--scale-paper)"/>`;
    const y=h=>gy-h*pxm;
    for(let i=1;i*0.1<=top+1e-9;i++){const h=i*0.1,major=i%2===0,heavy=i%10===0;
      g+=`<line x1="${left}" x2="${right}" y1="${y(h)}" y2="${y(h)}" stroke="var(${heavy?'--grid-heavy':'--grid-fine'})" stroke-width="${heavy?1:.6}" ${major?'':'stroke-dasharray="2 2"'}/>`}
    const cx=(left+right)/2;
    for(let x=0;x<=span/2+1e-9;x+=step){const heavy=Math.round(x/step)%5===0&&x>0;for(const sx of x?[cx-x*pxm,cx+x*pxm]:[cx])if(sx>=left-.1&&sx<=right+.1)
      g+=`<line x1="${sx}" x2="${sx}" y1="${y(top)}" y2="${gy}" stroke="var(${heavy?'--grid-heavy':'--grid-fine'})" stroke-width="${heavy?1:.6}"/>`}
    for(const [name,v] of shown){const dashed=S.measure!=='high';
      g+=`<line x1="${left}" x2="${right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--limit)" stroke-width="1.3" ${dashed?'stroke-dasharray="5 3"':''}/><text x="${right-2}" y="${y(v)-3}" font-size="8" text-anchor="end" fill="var(--limit)">${name} ${fmt(v)}</text>`}
    const w=m.wdh[0]*pxm,h=m.wdh[2]*pxm;
    if(m.img)g+=`<image href="${m.img}" x="${cx-w/2}" y="${gy-h}" width="${w}" height="${h}" preserveAspectRatio="none"/>`;
    for(const sx of [pad,W-pad-stick])for(let k=0;k*step<top-1e-9;k++)g+=`<rect x="${sx}" y="${y((k+1)*step)}" width="${stick}" height="${step*pxm}" fill="${k%2?'#cc3333':'#f0ece3'}" stroke="rgba(0,0,0,.25)" stroke-width=".4"/>`;
    g+=`<line x1="${pad}" x2="${W-pad}" y1="${gy}" y2="${gy}" stroke="var(--grid-heavy)" stroke-width="1.2"/><text x="${left+2}" y="${y(top)+9}" font-size="9" font-weight="700" fill="var(--grid-heavy)">${label}</text>`;
    return g+`</svg>`};
  return `<div class="scale">${one(S.before,'Before')}${one(S.after,'After')}</div>`;
}
const boxes=l=>(l||[]).map(([x,y,w,h])=>`<i class="bx" style="left:${x*100}%;top:${y*100}%;width:${w*100}%;height:${h*100}%"></i>`).join('');
const pins=(s,v)=>(s.p||[]).map((p,n)=>p[0]===v?`<i class="pin" data-pin="${n}" style="left:${p[1]*100}%;top:${p[2]*100}%">${n+1}</i>`:'').join('');
function view(it,i,s){
  const v=back.has(i)?'back':'front',I=it.img,b=v==='front'?I.b1:I.b2,a=v==='front'?I.a1:I.a2,bx=it.boxes[v];
  const flipb=`<button type="button" class="flipb" data-flip>${v==='front'?'↻ Back':'↻ Front'}</button>`;
  if(!it.visual)return `<div class="view"><figure class="pic" data-pinv="${v}"><img src="${a}" alt="model"><span class="cap l">${it.added?'New':it.changed?'After':'No change'}</span>${pins(s,v)}</figure>${flipb}</div>`;
  if(side)return `<div class="view"><div class="pair"><figure class="pic"><img src="${b}" alt="before"><span class="cap l">Before</span></figure><figure class="pic" data-pinv="${v}"><img src="${a}" alt="after"><span class="cap l">After</span>${boxes(bx)}${pins(s,v)}</figure></div>${flipb}</div>`;
  return `<div class="view"><div class="wipe" data-pinv="${v}"><img src="${b}" alt="before"><img class="a" src="${a}" alt="after"><div class="h"></div><span class="cap l">Before</span><span class="cap r">After</span>${pins(s,v)}</div>${flipb}</div><p class="tip">Drag to compare · tap to pin a spot</p>`;
}
function alerts(it){
  const out=[];
  const size=it.facts.find(f=>f.f==='size');
  if(it.scale&&size)out.push(`<p class="alert"><b>${size.factor>1?'⬆ Much bigger':'⬇ Much smaller'}: ×${(+size.factor).toFixed(2)}</b> — ${fmt(size.from)} → ${fmt(size.to)}, true size below</p>`);
  if(it.warn)out.push(`<p class="alert">⚠ ${esc(it.warn)}</p>`);
  if(it.added)out.push(`<p class="alert info">New model: there is no before</p>`);
  if(it.proposal)out.push(`<p class="alert info">💡 ${it.changed?'Also a proposal':'Proposal only, model not changed'}: ${esc(it.proposal)}</p>`);
  else if(it.added);
  else if(!it.changed)out.push(`<p class="alert info">No change to the model</p>`);
  else if(!it.visual&&!it.scale)out.push(`<p class="alert info">Pictures look the same. Changed: ${it.types.map(t=>({tag:'tags',geometry:'mesh',shape:'shape',size:'size',recolour:'colour'}[t])).join(", ")}</p>`);
  return out.join('');
}
const checks=it=>it.reasons.filter(r=>!(it.scale&&r.startsWith('size')));
function card(it,i){
  const s=st[it.model]||{},prop=it.proposal&&!it.changed;
  const issues=(s.v==='retry'||s.v==='revert'||(s.f||[]).length)?it.types.flatMap(t=>ISSUE[t]||[]).filter((x,k,a)=>a.indexOf(x)===k):[];
  const hint=prop&&PROPOSAL[s.v]?[PROPOSAL[s.v][0].slice(2),PROPOSAL[s.v][2]]:s.v?SAYS[s.v]:null;
  return `<article data-i="${i}" class="${s.v?'v-'+(MAIN.some(m=>m[0]===s.v)?s.v:'other'):''}">
<div class="head"><span class="name">${esc(it.model)}</span><span class="group">${esc(it.group)}</span></div>
${alerts(it)}
${it.change?`<p class="text"><span class="k">Changed:</span> ${esc(it.change)}</p>`:''}
${checks(it).length?`<p class="text why">⚑ Check: ${esc(checks(it).join(' · '))}</p>`:''}
${view(it,i,s)}${it.scale?scalePanel(it):''}${facts(it)}
<div class="main">${MAIN.map(([v,l,sub])=>`<button type="button" class="${v} ${s.v===v?'on':''}" data-v="${v}" aria-pressed="${s.v===v}">${prop?PROPOSAL[v][0]:l}<small>${prop?PROPOSAL[v][1]:sub}</small></button>`).join('')}</div>
${hint?`<p class="says"><b>${hint[0]}:</b> ${hint[1]}</p>`:''}
${issues.length||(it.thin||[]).length&&s.v==='relax'?`<div class="row"><span class="lb">What's wrong?</span>${issues.map(x=>`<button type="button" data-f="${esc(x)}" class="${(s.f||[]).includes(x)?'is':''}">${esc(x)}</button>`).join('')}${s.v==='relax'?(it.thin||[]).map(v=>`<button type="button" data-lim="thin limit ${v}" class="${(s.f||[]).includes('thin limit '+v)?'is':''}">thin to ${v}</button>`).join(''):''}</div>`:''}
<textarea id="c${i}" placeholder="${NEED.has(s.v)?'Needed: '+esc(SAYS[s.v][1].replace(/^.*\. /,'')):'Comment (optional)'}" class="${NEED.has(s.v)&&!s.c&&!(s.f||[]).length?'need':''}">${esc(s.c||'')}</textarea>
<div class="row"><span class="lb">More:</span>${MORE.map(([v,l])=>`<button type="button" data-v="${v}" class="${s.v===v?'on':''}">${l}</button>`).join('')}<button type="button" data-m="great" class="${s.m==='great'?'on':''}" title="Spot on, copy this elsewhere">★ Great</button><button type="button" data-m="bad" class="${s.m==='bad'?'on':''}" title="Opposite of the goal">✕✕ Awful</button></div>
</article>`;
}
function drawTop(){
  document.getElementById('top').innerHTML=`<span class="title">${esc(D.title)}</span><button type="button" class="switch" id="side" aria-pressed="${side}">Side by side</button><button type="button" class="switch" id="open" aria-pressed="${openOnly}">Only open</button>`;
}
function drawList(){
  const hi=D.items.map((it,i)=>[it,i]).filter(([it])=>it.risk==='high'),lo=D.items.map((it,i)=>[it,i]).filter(([it])=>it.risk!=='high');
  let html='';
  if(hi.length)html+=`<h2>Check these first <small>${hi.length}</small></h2>`+hi.map(([it,i])=>card(it,i)).join('');
  if(lo.length)html+=`<h2>Probably fine <small>${lo.length}</small><button type="button" class="switch" id="keepall">Keep all open</button></h2>`+lo.map(([it,i])=>card(it,i)).join('');
  document.getElementById('list').innerHTML=html;filter();count();
}
function filter(){document.querySelectorAll('article').forEach(a=>{a.hidden=openOnly&&Boolean(st[D.items[a.dataset.i].model]?.v)})}
function count(){const n=D.items.filter(it=>judged(st[it.model])).length;document.getElementById('n').textContent=`${n} of ${D.items.length} judged`}
function redraw(a){const box=document.createElement('div');box.innerHTML=card(D.items[a.dataset.i],+a.dataset.i);a.replaceWith(box.firstElementChild);count()}
function next(i){let n=document.querySelector(`article[data-i="${i}"]`).nextElementSibling;while(n&&(n.tagName!=='ARTICLE'||n.hidden))n=n.nextElementSibling;
  if(n)scrollTo({top:n.getBoundingClientRect().top+scrollY-document.getElementById('top').offsetHeight-6,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
document.addEventListener('click',e=>{
  if(e.target.closest('#side')){side=!side;drawTop();drawList();return}
  if(e.target.closest('#open')){openOnly=!openOnly;drawTop();filter();return}
  if(e.target.closest('#keepall')){for(const it of D.items)if(it.risk!=='high'&&!st[it.model]?.v)(st[it.model]||(st[it.model]={})).v='keep';save();drawList();return}
  const a=e.target.closest('article');if(!a)return;
  const i=+a.dataset.i,it=D.items[i],s=st[it.model]||(st[it.model]={});
  const done=()=>{if(empty(s))delete st[it.model];save();redraw(a)};
  if(e.target.closest('[data-flip]')){back.has(i)?back.delete(i):back.add(i);redraw(a);return}
  const pn=e.target.closest('[data-pin]');if(pn){s.p=s.p.filter((_,n)=>n!==+pn.dataset.pin);done();return}
  const fl=e.target.closest('[data-f]');if(fl){const k=fl.dataset.f;s.f=(s.f||[]).includes(k)?s.f.filter(x=>x!==k):[...(s.f||[]),k];done();return}
  const lm=e.target.closest('[data-lim]');if(lm){const k=lm.dataset.lim,on=(s.f||[]).includes(k);s.f=(s.f||[]).filter(x=>!x.startsWith('thin limit'));if(!on)s.f.push(k);done();return}
  const pv=e.target.closest('[data-pinv]');if(pv){if(dragged){dragged=false;return}const r=pv.getBoundingClientRect();s.p=[...(s.p||[]),[pv.dataset.pinv,+((e.clientX-r.left)/r.width).toFixed(3),+((e.clientY-r.top)/r.height).toFixed(3)]];done();return}
  const mk=e.target.closest('[data-m]');if(mk){s.m=s.m===mk.dataset.m?undefined:mk.dataset.m;done();return}
  const b=e.target.closest('[data-v]');if(!b)return;
  s.v=s.v===b.dataset.v?undefined:b.dataset.v;done();
  if(s.v==='keep'||s.v==='later')next(i);
  else if(NEED.has(s.v))document.getElementById('c'+i).focus({preventScroll:true});
});
document.addEventListener('input',e=>{const a=e.target.closest('article');if(!a)return;const it=D.items[a.dataset.i],s=st[it.model]||(st[it.model]={});
  s.c=e.target.value;e.target.classList.toggle('need',NEED.has(s.v)&&!s.c&&!(s.f||[]).length);if(empty(s))delete st[it.model];save();count()});
document.getElementById('cp').onclick=async()=>{
  const out={review:D.title,base:D.base,items:D.items.filter(it=>judged(st[it.model])).map(it=>{const s=st[it.model];return {model:it.model,
    verdict:s.v||(s.m==='great'?'keep':s.m==='bad'?'revert':(s.f||[]).length||(s.p||[]).length?'retry':'other'),
    mark:s.m||'',flags:s.f||[],pins:(s.p||[]).map((p,n)=>`${n+1}: ${p[0]} ${p[1]},${p[2]}`),comment:s.c||'',change:it.change||'',proposal:it.proposal||'',types:it.types,doubt:it.risk}})};
  const txt=JSON.stringify(out,null,1),btn=document.getElementById('cp');
  try{await navigator.clipboard.writeText(txt);btn.textContent='Copied'}catch(e){const ta=document.getElementById('ta');ta.value=txt;ta.select();btn.textContent='Selected, press copy'}
  setTimeout(()=>btn.textContent='Copy verdicts',1600);
};
drawTop();drawList();
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.wipe');if(!c||e.target.closest('.pin'))return;dragged=false;const x0=e.clientX;const set=ev=>{if(Math.abs(ev.clientX-x0)>5)dragged=true;if(!dragged)return;const r=c.getBoundingClientRect();c.style.setProperty('--x',Math.min(100,Math.max(0,(ev.clientX-r.left)/r.width*100))+'%')};
  c.setPointerCapture(e.pointerId);set(e);c.onpointermove=set;c.onpointerup=()=>{c.onpointermove=null}});
</script>
