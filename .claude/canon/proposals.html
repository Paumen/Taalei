<title>Canon Proposals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f7f8f6;
  --card: #ffffff;
  --fg: #1d2420;
  --muted: #66706a;
  --line: #dde2dd;
  --accent: #2f6b4f;
  --old-bg: #fbecea;
  --old-fg: #8a2d22;
  --new-bg: #e6f3eb;
  --new-fg: #1f5a3c;
  --warn: #9a6a12;
  --warn-bg: #fbf2de;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151916; --card: #1d221f; --fg: #e3e8e4; --muted: #96a19a; --line: #2f3732; --accent: #7cc39c;
    --old-bg: #3a201d; --old-fg: #f2aaa0; --new-bg: #183626; --new-fg: #a5dcbb; --warn: #e3b860; --warn-bg: #362a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151916; --card: #1d221f; --fg: #e3e8e4; --muted: #96a19a; --line: #2f3732; --accent: #7cc39c;
  --old-bg: #3a201d; --old-fg: #f2aaa0; --new-bg: #183626; --new-fg: #a5dcbb; --warn: #e3b860; --warn-bg: #362a12;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
}
main { max-width: 540px; margin: 0 auto; display: grid; gap: 8px; }
.bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tab { font: 500 13px var(--sans); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.tab[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.tab:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.state { margin-left: auto; color: var(--muted); font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; min-width: 0; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; font-size: 12px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 600; font-size: 14px; flex-basis: 100%; }
.chip { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .04em; padding: 0 5px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); }
.chip.approved, .chip.applied { background: var(--new-bg); color: var(--new-fg); }
.chip.rejected { background: var(--old-bg); color: var(--old-fg); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
.tag.add { color: var(--new-fg); background: var(--new-bg); border-color: transparent; }
.tag.del { color: var(--old-fg); background: var(--old-bg); border-color: transparent; text-decoration: line-through; }
.change { font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.change ins { text-decoration: none; background: var(--new-bg); color: var(--new-fg); border-radius: 3px; }
.change del { background: var(--old-bg); color: var(--old-fg); border-radius: 3px; }dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.thread { display: grid; gap: 3px; font-size: 13px; border-top: 1px solid var(--line); padding-top: 5px; }
.thread div span { color: var(--muted); font-size: 12px; }
textarea { font: 13px var(--sans); width: 100%; box-sizing: border-box; min-height: 34px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); padding: 4px 6px; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.acts button { font: 500 13px var(--sans); border-radius: 6px; padding: 5px 0; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
.acts button.approve { background: var(--accent); border-color: var(--accent); color: var(--card); }
.acts button:disabled { opacity: .45; cursor: default; }
.hint { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 14px 4px; }
</style>

<main>
  <div class="bar">
    <button class="tab" id="tab-open" aria-pressed="true">To decide</button>
    <button class="tab" id="tab-log" aria-pressed="false">Log</button>
    <span class="state" id="state">Loading…</span>
  </div>
  <div id="list"><p class="empty">Proposals show here once Claude adds them.</p></div>
</main>

<script>
const LABELS = { pending: 'to decide', approved: 'approved', applied: 'in canon', rejected: 'rejected', clarify: 'clarify', adjust: 'adjust' };
let docs = [];
let view = 'open';
let canWrite = true;
let db = null;
const busy = new Set();

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const when = (iso) => iso ? new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';

function field(dl, name, value) {
  if (!value) return;
  dl.append(el('dt', null, name), el('dd', null, value));
}

function parse(line) {
  const m = /^-?\s*\[([^\]]*)\]\s*([\s\S]*)$/.exec(line || '');
  if (!m) return { meta: [], text: line || '' };
  return { meta: m[1].split('·').map((s) => s.trim()).filter(Boolean), text: m[2].trim() };
}

function diff(a, b) {
  const x = a ? a.split(/(\s+)/) : [];
  const y = b ? b.split(/(\s+)/) : [];
  const n = x.length, m = y.length;
  const t = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) t[i][j] = x[i] === y[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const out = [];
  const push = (k, s) => { const last = out[out.length - 1]; if (last && last[0] === k) last[1] += s; else out.push([k, s]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && x[i] === y[j]) { push('=', x[i]); i++; j++; }
    else if (j < m && (i >= n || t[i][j + 1] >= t[i + 1][j])) { push('+', y[j]); j++; }
    else { push('-', x[i]); i++; }
  }
  return out;
}

function change(oldLine, newLine) {
  const a = parse(oldLine), b = parse(newLine);
  const tags = el('div', 'tags');
  const base = newLine ? b.meta : a.meta;
  for (const s of base) tags.append(el('span', 'tag' + (oldLine && newLine && !a.meta.includes(s) ? ' add' : ''), s));
  if (oldLine && newLine) for (const s of a.meta) if (!b.meta.includes(s)) tags.append(el('span', 'tag del', s));
  const line = el('div', 'change');
  const parts = !oldLine ? [['=', b.text]] : !newLine ? [['-', a.text]] : diff(a.text, b.text);
  let del = '', ins = '';
  const flush = () => {
    if (del.trim()) line.append(el('del', null, del.trim()));
    if (del.trim() && ins.trim()) line.append(' ');
    if (ins.trim()) line.append(el('ins', null, ins.trim()));
    if (del || ins) line.append(' ');
    del = ''; ins = '';
  };
  parts.forEach(([k, s], i) => {
    if (k === '-') del += s;
    else if (k === '+') ins += s;
    else if (!s.trim() && (del || ins) && parts[i + 1] && parts[i + 1][0] !== '=') { del += s; ins += s; }
    else { flush(); line.append(s.replace(/^\s+/, line.lastChild && line.lastChild.nodeType === 3 && / $/.test(line.lastChild.textContent) ? '' : '$&')); }
  });
  flush();
  if (!oldLine) tags.prepend(el('span', 'tag add', 'new item'));
  if (!newLine) tags.prepend(el('span', 'tag del', 'removed'));
  return [tags, line];
}

function card(d) {
  const p = d.data();
  const c = el('article', 'card');
  const meta = el('div', 'meta');
  meta.append(el('b', null, p.title || d.id), el('span', 'chip ' + p.status, LABELS[p.status] || p.status), el('span', null, [p.repo, when(p.updated || p.created)].filter(Boolean).join(' · ')));
  c.append(meta);
  c.append(...change(p.old, p.new));
  const dl = el('dl');
  field(dl, 'Trigger', p.trigger);
  field(dl, 'Effect', p.effect);
  field(dl, 'Risk', p.risk);
  field(dl, 'Example', p.example);
  field(dl, 'Reviewer', p.review);
  c.append(dl);
  const thread = Array.isArray(p.thread) ? p.thread : [];
  if (thread.length) {
    const t = el('div', 'thread');
    for (const m of thread) {
      const row = el('div');
      row.append(el('span', null, (m.by === 'po' ? 'You' : 'Claude') + (m.verdict ? ' · ' + m.verdict : '') + ' · ' + when(m.at) + ' — '), document.createTextNode(m.note || ''));
      t.append(row);
    }
    c.append(t);
  }
  if (p.status === 'pending') c.append(controls(d, p));
  return c;
}

function controls(d, p) {
  const box = el('div');
  box.style.display = 'grid';
  box.style.gap = '5px';
  if (!canWrite) { box.append(el('p', 'hint', 'Only the owner can decide.')); return box; }
  const note = el('textarea');
  note.id = 'note-' + d.id;
  note.placeholder = 'Note (needed for clarify and adjust)';
  const acts = el('div', 'acts');
  const buttons = [['approve', 'Approve'], ['reject', 'Reject'], ['clarify', 'Clarify'], ['adjust', 'Adjust']].map(([v, label]) => {
    const b = el('button', v, label);
    b.type = 'button';
    b.addEventListener('click', () => decide(d, p, v === 'approve' ? 'approved' : v === 'reject' ? 'rejected' : v, note.value.trim()));
    return b;
  });
  const sync = () => { for (const b of buttons) b.disabled = busy.has(d.id) || ((b.className === 'clarify' || b.className === 'adjust') && !note.value.trim()); };
  note.addEventListener('input', sync);
  sync();
  acts.append(...buttons);
  box.append(note, acts);
  return box;
}

async function decide(d, p, verdict, note) {
  if (busy.has(d.id)) return;
  busy.add(d.id);
  render();
  const at = new Date().toISOString();
  const thread = (Array.isArray(p.thread) ? p.thread : []).concat([{ by: 'po', verdict, note, at }]);
  try {
    await db.doc('proposals/' + d.id).update({ status: verdict, updated: at, thread });
    setState('Saved: ' + (LABELS[verdict] || verdict));
  } catch (e) {
    if (e && e.code === 'invalid_argument') { canWrite = false; setState('Read only'); }
    else setState('Not saved. Try again.');
  } finally {
    busy.delete(d.id);
    render();
  }
}

function setState(text) { document.getElementById('state').textContent = text; }

function render() {
  const list = document.getElementById('list');
  const open = docs.filter((d) => d.data().status === 'pending');
  const log = docs.filter((d) => d.data().status !== 'pending').sort((a, b) => String(b.data().updated || '').localeCompare(String(a.data().updated || '')));
  document.getElementById('tab-open').textContent = 'To decide (' + open.length + ')';
  document.getElementById('tab-log').textContent = 'Log (' + log.length + ')';
  const shown = view === 'open' ? open : log;
  list.replaceChildren();
  if (!shown.length) {
    list.append(el('p', 'empty', view === 'open' ? 'Nothing to decide. Claude adds proposals here when canon needs a change.' : 'No decisions yet.'));
    return;
  }
  const wrap = el('div');
  wrap.style.display = 'grid';
  wrap.style.gap = '8px';
  wrap.append(...shown.map(card));
  list.append(wrap);
}

for (const [id, v] of [['tab-open', 'open'], ['tab-log', 'log']]) {
  document.getElementById(id).addEventListener('click', () => {
    view = v;
    document.getElementById('tab-open').setAttribute('aria-pressed', String(v === 'open'));
    document.getElementById('tab-log').setAttribute('aria-pressed', String(v === 'log'));
    render();
  });
}

(async () => {
  db = await window.claude?.use?.('db');
  if (!db) { setState('Sign in to see proposals'); return; }
  const user = await window.claude.use('user');
  const can = user ? await user.can('data.write') : null;
  if (can === false) canWrite = false;
  db.collection('proposals').orderBy('created', 'desc').onSnapshot((snap) => {
    docs = snap.docs;
    setState(canWrite ? '' : 'Read only');
    render();
  }, () => setState('Proposals could not load'));
})();
</script>
