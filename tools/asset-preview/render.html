<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const specUrl = params.get('spec');
const spec = await (await fetch(specUrl)).json();

const W = spec.width ?? 1600, H = spec.height ?? 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// Lighting tuned so flat-shaded palette colors read clearly, Kenney-viewer-like.
scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 8, 5);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

const loader = new GLTFLoader();

// ---- blockout geometry builders -----------------------------------------
// All flat-shaded clay grey; roofs/accents slightly darker so masses read.
const MAT = {
  clay: new THREE.MeshStandardMaterial({ color: 0xd8d2c8, flatShading: true, metalness: 0, roughness: 1 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x8f8a82, flatShading: true, metalness: 0, roughness: 1 }),
  mid:  new THREE.MeshStandardMaterial({ color: 0xb8b2a8, flatShading: true, metalness: 0, roughness: 1 }),
};

function add(group, geo, mat, x, y, z, ry = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  group.add(m);
  return m;
}
// n-sided prism/frustum, flat-shaded, base at y0
function frustum(rBot, rTop, h, n) {
  const g = new THREE.CylinderGeometry(rTop, rBot, h, n, 1, false);
  return g.toNonIndexed();
}
function box(w, h, d) { return new THREE.BoxGeometry(w, h, d); }
function cone(r, h, n) { return new THREE.ConeGeometry(r, h, n).toNonIndexed(); }

MAT.glass = new THREE.MeshStandardMaterial({ color: 0x5a6470, flatShading: true, metalness: 0, roughness: 1 });

const BLOCKOUTS = {
  // A — classic round tapered tower, 8-sided
  A() {
    const g = new THREE.Group();
    // stone plinth
    add(g, frustum(0.85, 0.72, 0.4, 8), MAT.mid, 0, 0.2, 0);
    // tapered shaft
    add(g, frustum(0.62, 0.42, 2.9, 8), MAT.clay, 0, 0.4 + 1.45, 0);
    // gallery deck, clearly wider than shaft top
    add(g, frustum(0.62, 0.62, 0.16, 8), MAT.dark, 0, 3.3 + 0.08, 0);
    // lantern room (glass), narrower than gallery
    add(g, frustum(0.4, 0.4, 0.55, 8), MAT.glass, 0, 3.46 + 0.275, 0);
    // roof cap + short cone, flush with lantern wall (no overhang)
    add(g, frustum(0.4, 0.4, 0.1, 8), MAT.dark, 0, 4.01 + 0.05, 0);
    add(g, cone(0.4, 0.42, 8), MAT.dark, 0, 4.11 + 0.21, 0);
    // door hint
    add(g, box(0.34, 0.55, 0.12), MAT.dark, 0, 0.4 + 0.275, 0.62);
    return g;
  },
  // B — chunky square tower with keeper's hut, storybook
  B() {
    const g = new THREE.Group();
    // low chunky rock base
    add(g, frustum(1.0, 0.85, 0.35, 8), MAT.mid, 0, 0.175, 0);
    // square tapered shaft
    add(g, frustum(0.6, 0.44, 2.6, 4), MAT.clay, 0, 0.35 + 1.3, 0);
    // square gallery slab, wider than shaft top
    add(g, box(1.3, 0.16, 1.3), MAT.dark, 0, 2.95 + 0.08, 0);
    // square lantern room, narrower than gallery
    add(g, box(0.8, 0.6, 0.8), MAT.glass, 0, 3.11 + 0.3, 0);
    // pyramid roof flush with lantern walls
    add(g, box(0.8, 0.1, 0.8), MAT.dark, 0, 3.71 + 0.05, 0);
    add(g, cone(0.8 * Math.SQRT1_2, 0.5, 4), MAT.dark, 0, 3.81 + 0.25, 0, Math.PI / 4);
    // attached keeper's hut with gable
    add(g, box(0.7, 0.6, 0.55), MAT.clay, 0.85, 0.35 + 0.3, 0);
    add(g, cone(0.52, 0.4, 4), MAT.dark, 0.85, 0.95 + 0.2, 0, Math.PI / 4);
    return g;
  },
  // C — caricatured hexagonal tower: fat belly, narrow waist, flared crown
  C() {
    const g = new THREE.Group();
    // fat belly base
    add(g, frustum(0.95, 0.5, 1.7, 6), MAT.clay, 0, 0.85, 0);
    // narrow waist
    add(g, frustum(0.5, 0.42, 1.0, 6), MAT.clay, 0, 1.7 + 0.5, 0);
    // flared crown out to gallery width
    add(g, frustum(0.42, 0.68, 0.5, 6), MAT.mid, 0, 2.7 + 0.25, 0);
    // gallery rim
    add(g, frustum(0.7, 0.7, 0.14, 6), MAT.dark, 0, 3.2 + 0.07, 0);
    // lantern
    add(g, frustum(0.44, 0.44, 0.6, 6), MAT.glass, 0, 3.34 + 0.3, 0);
    // roof: flush cap + squat cone
    add(g, frustum(0.44, 0.44, 0.1, 6), MAT.dark, 0, 3.94 + 0.05, 0);
    add(g, cone(0.44, 0.45, 6), MAT.dark, 0, 4.04 + 0.225, 0);
    // door
    add(g, box(0.34, 0.55, 0.12), MAT.dark, 0, 0.275, 0.85);
    return g;
  },
};

// ---- place items ---------------------------------------------------------
const root = new THREE.Group();
scene.add(root);

for (const item of spec.items) {
  let obj;
  if (item.glb) {
    const gltf = await new Promise((res, rej) => loader.load(item.glb, res, undefined, rej));
    obj = gltf.scene;
  } else if (item.blockout) {
    obj = BLOCKOUTS[item.blockout]();
  }
  obj.position.set(item.x ?? 0, item.y ?? 0, item.z ?? 0);
  if (item.ry) obj.rotation.y = item.ry;
  root.add(obj);

  if (item.label) {
    // simple canvas sprite label under the model
    const c = document.createElement('canvas');
    c.width = 512; c.height = 96;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#555';
    ctx.font = '48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(item.label, 256, 64);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
    sp.scale.set(2.6, 0.49, 1);
    sp.position.set(item.x ?? 0, -0.55, item.z ?? 0);
    root.add(sp);
  }
}

// ---- camera: fit whole row -----------------------------------------------
const bb = new THREE.Box3().setFromObject(root);
const size = bb.getSize(new THREE.Vector3());
const center = bb.getCenter(new THREE.Vector3());

const cam = new THREE.PerspectiveCamera(spec.fov ?? 30, W / H, 0.1, 200);
const az = (spec.azimuthDeg ?? 32) * Math.PI / 180;
const el = (spec.elevationDeg ?? 14) * Math.PI / 180;
const vFov = cam.fov * Math.PI / 360;
const hFov = Math.atan(Math.tan(vFov) * cam.aspect);
const fitDist = Math.max((size.x / 2 + size.z / 2) / Math.tan(hFov), (size.y / 2) / Math.tan(vFov));
const d = fitDist * (spec.zoom ?? 1.1);
cam.position.set(
  center.x + d * Math.sin(az) * Math.cos(el),
  center.y + d * Math.sin(el),
  center.z + d * Math.cos(az) * Math.cos(el),
);
cam.lookAt(center);

renderer.render(scene, cam);
window.__done = true;
</script>
