# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Deployt bij elke commit op main. Andere branches kunnen niet automatisch
  # deployen: de github-pages-omgeving laat standaard alleen de default branch
  # toe en weigert de run vóór er een runner start. Wil je ook vanaf een
  # feature-branch publiceren, zet dan in Settings → Environments → github-pages
  # de "Deployment branches" op All branches; daarna kan `branches` hier weg.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
