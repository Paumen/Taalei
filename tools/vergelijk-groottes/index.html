<body>
<script type="module">
addEventListener('error', () => { window.FOUT = true; });
addEventListener('unhandledrejection', () => { window.FOUT = true; });
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const params = new URLSearchParams(location.search);
const groupsData = await (await fetch(params.get('bron') ?? './groups.json')).json();
const group = groupsData[params.get('group')];
if (!group) { document.title = 'ONBEKENDE GROEP'; throw new Error('groep?'); }
const W = 1800, H = 760;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4da);
scene.add(new THREE.HemisphereLight(0xffffff, 0x887766, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 6, 5);
scene.add(sun);
const loader = new GLTFLoader();
const load = (p) => new Promise((res, rej) => loader.load(p, res, undefined, rej));
function label(text, x, scale) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 96;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#222'; ctx.font = '600 44px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 512, 62);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  spr.scale.set(scale * 10.6, scale, 1);
  spr.position.set(x, -scale * 0.7, 1.2);
  spr.center.set(0.5, 1);
  scene.add(spr);
}
function meetlat(x) {
  for (let i = 0; i < 4; i++) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.25, 0.08),
      new THREE.MeshLambertMaterial({ color: i % 2 ? 0xcc3333 : 0xf0ece3 }));
    mesh.position.set(x, 0.125 + i * 0.25, 0);
    scene.add(mesh);
  }
}
let x = 0;
const GAP = 0.55;
meetlat(0);
const placed = [{ x: 0, label: '1 unit', rij: 0 }];
x += 0.3;
let even = true;
for (const item of group.items) {
  const gltf = await load('/kits/' + item.pad);
  const obj = gltf.scene;
  let box = new THREE.Box3().setFromObject(obj);
  let size = box.getSize(new THREE.Vector3());
  const pivot = new THREE.Group();
  pivot.add(obj);
  if (size.z > size.x * 1.4) obj.rotation.y = Math.PI / 2;
  box = new THREE.Box3().setFromObject(pivot);
  size = box.getSize(new THREE.Vector3());
  x += GAP + size.x / 2;
  pivot.position.set(x - (box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
  scene.add(pivot);
  placed.push({ x, label: item.label + '  h=' + size.y.toFixed(2), rij: even ? 0 : 1 });
  even = !even;
  x += size.x / 2;
}
const totalW = x + 0.3;
const maxH = new THREE.Box3().setFromObject(scene).max.y;
const grid = new THREE.GridHelper(80, 80, 0xaaa298, 0xc6bfb2);
grid.position.set(39, 0, 0);
scene.add(grid);
const labelScale = Math.max(0.12, totalW / 46);
for (const p of placed) label(p.label, p.x, labelScale);
{
  let i = 0;
  for (const kind of scene.children) {
    if (kind.isSprite && placed[i]) {
      if (placed[i].rij === 1) kind.position.y -= labelScale * 1.15;
      i++;
    }
  }
}
const aspect = W / H;
const midX = totalW / 2 - 0.5;
const viewH = Math.max(maxH * 1.25 + labelScale * 2.4, (totalW + 1) / aspect * 1.02);
const cam = new THREE.OrthographicCamera(
  -viewH * aspect / 2, viewH * aspect / 2, viewH * 0.62, -viewH * 0.38, 0.1, 200);
cam.position.set(midX + viewH * 0.12, maxH * 0.45 + viewH * 0.18, 30);
cam.lookAt(midX + viewH * 0.12, maxH * 0.45 - viewH * 0.05, 0);
scene.add(cam);
renderer.render(scene, cam);
document.title = 'KLAAR:' + group.items.length;
window.KLAAR = true;
</script>
